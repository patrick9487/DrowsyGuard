plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.google.dagger.hilt.android'
    id 'de.undercouch.download'
}

android {
    namespace 'com.patrick.main'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "com.patrick.drowsyguard"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // 啟用多 dex 支持
        multiDexEnabled true
        
        // 向量繪圖支持
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // 簽名配置
            signingConfig signingConfigs.debug
        }
        
        debug {
            minifyEnabled false
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            "-opt-in=kotlin.RequiresOptIn",
            "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi"
        ]
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.10"
    }
}

// import DownloadMPTasks task
project.ext.ASSET_DIR = projectDir.toString() + '/src/main/assets'
apply from: 'download_tasks.gradle'

dependencies {
    // 使用版本目錄
    implementation libs.bundles.androidx
    implementation libs.bundles.lifecycle
    implementation libs.bundles.navigation
    implementation libs.bundles.camerax
    implementation libs.bundles.compose
    
    // 單獨依賴
    implementation libs.kotlinx.coroutines.android
    implementation libs.activity.compose
    implementation libs.lifecycle.runtime.compose
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.window
    implementation libs.mediapipe.tasks.vision
    implementation libs.accompanist.permissions
    implementation libs.startup.runtime
    
    // 項目模組
    implementation project(':ui-components')
    implementation project(':detection-logic')
    implementation project(':user-alert')
    implementation project(':shared-core')
    implementation project(':camera-input')
    implementation project(':user-settings')
    implementation project(':account-auth')
    
    // Hilt 依賴注入
    implementation libs.hilt.android
    kapt libs.hilt.compiler
    
    // 測試依賴
    testImplementation libs.bundles.unit.testing
    androidTestImplementation libs.bundles.testing
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest
}